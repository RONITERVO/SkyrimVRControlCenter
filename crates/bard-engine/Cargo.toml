[package]
name = "skyrim-bard-engine"
version.workspace = true
description = "Loopback OpenRouter lyrics/dialogue relay and Suno variant archiver for Skyrim VR"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = "0.4.45"
fs2 = "0.4.3"
futures-util = "0.3.33"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
